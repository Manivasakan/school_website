name = "school-site"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Set these in the Cloudflare dashboard (Settings → Variables) OR via wrangler secret put
# Don't commit secrets to wrangler.toml — use:
#   wrangler secret put AUTH_SECRET
#   wrangler secret put DATABASE_URL
#   wrangler secret put R2_SECRET_ACCESS_KEY
#   (etc.)

# Example R2 binding (optional — we use S3 API directly, but you can also bind R2):
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "school-media"
