name = "schoolwebsite"
# node:sqlite (used by OpenNext's bundle) needs compat_date >= 2025-04-08.
# Bump to a recent date to get all latest Workers runtime features.
compatibility_date = "2025-04-15"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Keep dashboard-enabled observability settings synced into source control.
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
